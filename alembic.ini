[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL is injected at runtime via Settings in env.py —
# this placeholder prevents Alembic CLI from erroring on startup.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/stocksage

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
